<!DOCTYPE html>
<html>
    <head>
    <title>Las Galletas de la Abuela</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
    :root {
        --fondo: #0f0f1a;
        --fondo2: #1a1a2e;
        --texto: #ffffff;
        --texto2: #a8a8b3;

    }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
        font-family: 'Poppins', sans-serif;
        background-color: var(--fondo);
        color: var(--texto);
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        padding: -100px;
        margin: 0;
        }
        
        /*HEADER*/
        header {
        background-color: var(--fondo2);    
        padding: 60px 20px;
        text-align: center;
        
    }

    header h1 { font-size: 48px; color: var(--principal); }
    header p { font-size: 20px; color: var(--texto2); margin: 20px 0; }

    /* SECCIONES */
    section {
        max-width: 800px;
        margin: 40px auto;
        padding: 0 20px;
    }

    h2 {
        font-size: 24px;
    color: var(--principal);
    margin-bottom: 16px;
    border-bottom: 1px solid var(--principal);
    padding-bottom: 8px;
    }

    p { color: var(--texto2); line-height: 1.8; }

    /* HABILIDADES */
    .habilidades {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 10px;    
    }
    .habilidad {
        background-color: var(--fondo2);
        border: 1px solid var(--principal);
        color: var(--principal);
        padding: 8px 16px;
        border-radius: 20px;
        font-size: 14px;
    }
        .tarjeta {
        background-color: var(--fondo2);
        border-radius: 12px;
        padding: 30px 40px;
        width: 350px;
        text-align: center;
        }

        h1 {
        color: var(--texto);
        }

        ul { 
        text-align: left;
        display: inline-block;
        color: white;
        font-size: 16px;
        }

        button {
        /* BOTONES */
        button {
        margin: 6px;
        padding: 10px 18px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-size: 14px;
        font-weight: bold;
        }

        .btn-verde { background-color: #27ae60; color: white; }
        .btn-morado { background-color: #6c63ff; color: white; }
        .btn-rojo { background-color: #e74c3c; color: white; }
        .btn-gris { background-color: #444; color: white; }

            /* SECCIONES */
        .seccion {
        margin-top: 20px;
        padding-top: 16px;
        border-top: 1px solid #2d2d4e;
        }

        .seccion h3 { color: #a8a8b3; font-size: 14px; margin-bottom: 10px; }

        /* TEMPORIZADOR */
        #tiempo {
        font-size: 36px;
        font-weight: bold;
        color: #6c63ff;
        margin: 10px 0;
        }

          /* PORCIONES */
        #porciones-num {
        font-size: 28px;
        font-weight: bold;
        color: white;
        margin: 0 16px;
        }

        .fila { display: flex; justify-content: center; align-items: center; }

        /* ESTRELLAS */
        .estrella {
        font-size: 32px;
        cursor: pointer;
        color: #444;
        transition: color 0.2s;
        }

        .estrella:hover, .estrella.activa { color: #f1c40f; }
    #mensaje-estrellas {
        color: #a8a8b3;
        font-size: 14px;
        margin-top: 8px;
    }
    </style>
    </head>
    <body>
    <div class="tarjeta">
        <h1>🍪 Las Galletas de la Abuela</h1>
        <!-- INGREDIENTES -->
        <ul id="ingredientes" style="display:none">
        <li id="ing1">1 taza de harina</li>
        <li id="ing2">1/2 taza de azúcar</li>
        <li id="ing3">1/2 taza de mantequilla</li>
        <li id="ing4">1 huevo</li>
        <li id="ing5">1 cdita de esencia de vainilla</li>
        </ul>
        
        <br>
        <button  class="btn-morado" id="btn-receta" onclick="toggleReceta()">Ver receta completa</button>

        </button>
        <!-- MULTIPLICADOR DE PORCIONES -->
        <div class="seccion">
        <h3>🍽️ Porciones</h3>
        <div class="fila">
            <button class="btn-gris" onclick="cambiarPorcion(-1)">-</button>
            <span id="porciones-num">1x</span>
            <button class="btn-gris" onclick="cambiarPorcion(1)">-</button>
        </div>
    </div>
        <!-- TEMPORIZADOR -->
        <div class="seccion">
        <h3>⏱️ Temporizador de horneado (12 min)</h3>
        <div id="tiempo">12:00</div>
        <button class="btn-verde" onclick="iniciarTimer()">▶ Iniciar</button>
        <button class="btn-rojo" onclick="pausarTimer()">Pausar</button>
        <button class="btn-gris" onclick="resetTimer()">↺ Reiniciar</button>
    </div>

        <!-- CALIFICACIÓN -->
        <div class="seccion">
        <h3>⭐ Califica esta receta</h3>
        <div>
        <span class="estrella" onclick="calificar(1)">★</span>
        <span class="estrella" onclick="calificar(2)">★</span>
        <span class="estrella" onclick="calificar(3)">★</span>
        <span class="estrella" onclick="calificar(4)">★</span>
        <span class="estrella" onclick="calificar(5)">★</span>
        </div>
        <p id="mensaje-estrellas">Selecciona una calificación</p>
    </div>
    </body>
    <script>
// ── RECETA ──────────────────────────────
        function toggleReceta() {
        const lista = document.getElementById("ingredientes")
        const boton = document.getElementById("btn-receta")
        if (lista.style.display === "none") {
            lista.style.display = "block"
            boton.textContent = "Ocultar receta"
        } else {
            lista.style.display = "none"
            boton.textContent = "Ver receta completa"
        }
    }
    // ── PORCIONES ───────────────────────────
        const base = [1, 0.5, 0.5, 1, 1]
        const unidades = [" taza de harina", "/2 taza de azúcar",
        "/2 taza de mantequilla", " huevo", " cdita de vainilla"]
        let porcion = 1

        function cambiarPorcion(cambio) {
        if (porcion + cambio < 1) return
        porcion += cambio
        document.getElementById("porciones-num").textContent = porcion + "x"
        const ids = ["ing1","ing2","ing3","ing4","ing5"]
        const prefijos = ["","1","1","",""]
        ids.forEach((id, i) => {
          const cantidad = base[i] * porcion
            document.getElementById(id).textContent =
            cantidad + unidades[i]
        })
    }
       // ── TEMPORIZADOR ────────────────────────
        let segundos = 720
        let intervalo = null

        function actualizarDisplay() {
        const m = Math.floor(segundos / 60)
        const s = segundos % 60
        document.getElementById("tiempo").textContent =
            String(m).padStart(2,"0") + ":" + String(s).padStart(2,"0")
    }

function iniciarTimer() {
        if (intervalo) return
        intervalo = setInterval(() => {
            if (segundos <= 0) {
            clearInterval(intervalo)
            intervalo = null
            document.getElementById("tiempo").textContent = "¡Listo! 🍪"
            return
    }
            segundos--
            actualizarDisplay()
        }, 1000)
    }
    function pausarTimer() {
        clearInterval(intervalo)
        intervalo = null
    }
    function resetTimer() {
        clearInterval(intervalo)
        intervalo = null
        segundos = 720
        actualizarDisplay()
    }
      // ── ESTRELLAS ───────────────────────────
        const mensajes = ["", "¡Mala receta 😞", "Regular 😐",
        "Buena receta 😊", "¡Muy buena! 😄", "¡Excelente receta! 🤩"]

        function calificar(n) {
        const estrellas = document.querySelectorAll(".estrella")
        estrellas.forEach((e, i) => {
        e.classList.toggle("activa", i < n)
        })
        document.getElementById("mensaje-estrellas").textContent = mensajes[n]
    }
    </script>   
    </body>
</html>
