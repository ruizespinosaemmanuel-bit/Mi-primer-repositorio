<!DOCTYPE html>
<html>
    <head>
    <title>Las Galletas de la Abuela</title>
    <style>
        body {
        background-color: black;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        padding: -10px;
        margin: 0;
        }

        .tarjeta {
        background-color: #1a1a2e;
        border-radius: 12px;
        padding: 30px 40px;
        width: 350px;
        text-align: center;
        }

        h1 {
        color: beige;
        }

        ul {
        text-align: left;
        display: inline-block;
        color: white;
        font-size: 16px;
        }

        button {
        margin-top: 20px;
        background-color: gray;
        color: black;
        border: none;
        padding: 10px 20px;
        border-radius: 8px;
        font-size: 16px;
        cursor: pointer;
        }
    </style>
    </head>
    <body>
    <div class="tarjeta">
        <h1>Las Galletas de la Abuela</h1>
        <ul>
        <li>1 taza de harina</li>
        <li>1/2 taza de azúcar</li>
        <li>1/2 taza de mantequilla</li>
        <li>1 huevo</li>
        <li>1 cucharadita de esencia de vainilla</li>
        </ul>
        <br>
        <button>Receta completa</button>
    </div>
    </body>
</html>
